<script>
(() => {
  'use strict';
  const vault = JSON.parse(document.getElementById('vault-data').textContent);
  const form = document.getElementById('unlock');
  const passwordInput = document.getElementById('password');
  const submit = document.getElementById('submit');
  const status = document.getElementById('status');
  const content = document.getElementById('content');
  const lock = document.getElementById('lock');
  const summary = document.getElementById('summary');
  let generation = 0;
  const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
  const clearBytes = bytes => { if (bytes) bytes.fill(0); };

  function lockDocument() {
    generation += 1;
    const frame = content.querySelector('iframe');
    if (frame) { frame.srcdoc = ''; frame.remove(); }
    content.replaceChildren();
    content.hidden = true;
    form.hidden = false;
    lock.hidden = true;
    passwordInput.value = '';
    submit.disabled = false;
    submit.textContent = '解密阅读';
    status.textContent = '';
    summary.textContent = '输入密码，在当前浏览器中阅读。';
    passwordInput.focus();
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submit.disabled || !passwordInput.value) return;
    const attempt = ++generation;
    let passwordBytes = new TextEncoder().encode(passwordInput.value);
    let plaintext = null;
    let keyMaterial = null;
    let key = null;
    let documentText = '';
    passwordInput.value = '';
    submit.disabled = true;
    submit.textContent = '解密中…';
    status.textContent = '';
    try {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error('UNSUPPORTED');
      }
      if (vault.format !== 'local-notes-vault-v1' || vault.cipher !== 'AES-GCM' || vault.keyBits !== 256 || vault.tagBits !== 128 || vault.kdf !== 'PBKDF2' || vault.hash !== 'SHA-256' || vault.iterations !== 600000 || vault.additionalData !== 'local-notes-vault-v1') throw new Error('INVALID');
      const salt = decode(vault.salt);
      const iv = decode(vault.iv);
      const ciphertext = decode(vault.ciphertext);
      if (salt.length !== 16 || iv.length !== 12 || ciphertext.length < 17) throw new Error('INVALID');
      keyMaterial = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
      clearBytes(passwordBytes);
      passwordBytes = null;
      key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:600000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']);
      keyMaterial = null;
      plaintext = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv, tagLength:128, additionalData:new TextEncoder().encode(vault.additionalData)}, key, ciphertext));
      key = null;
      if (attempt !== generation) return;
      documentText = new TextDecoder('utf-8', {fatal:true}).decode(plaintext);
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', '');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('title', '已解密笔记');
      // First policy in the child document blocks its scripts, resources and forms.
      // The empty sandbox also disallows scripts, same-origin access, popups and top navigation.
      frame.srcdoc = '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;none&#39;; style-src &#39;unsafe-inline&#39;; img-src data:; connect-src &#39;none&#39;; font-src &#39;none&#39;; frame-src &#39;none&#39;; object-src &#39;none&#39;; form-action &#39;none&#39;; base-uri &#39;none&#39;">' + documentText;
      content.replaceChildren(frame);
      content.hidden = false;
      form.hidden = true;
      lock.hidden = false;
      summary.textContent = '已解锁。阅读结束后可点击“锁定”。';
      lock.focus();
    } catch (error) {
      if (attempt !== generation) return;
      status.textContent = error.message === 'UNSUPPORTED'
        ? '此浏览器未提供本地解密能力。请下载文件后，用较新的 Edge、Chrome 或 Firefox 打开。'
        : '无法解密：密码不正确，或文件已损坏、被修改。请检查密码或重新下载。';
      passwordInput.focus();
    } finally {
      clearBytes(passwordBytes);
      clearBytes(plaintext);
      passwordBytes = null;
      plaintext = null;
      keyMaterial = null;
      key = null;
      documentText = '';
      if (attempt === generation) {
        submit.disabled = false;
        submit.textContent = '解密阅读';
      }
    }
  });
  lock.addEventListener('click', lockDocument);
  window.addEventListener('pagehide', lockDocument);
})();
</script>
